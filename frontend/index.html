<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Mi Pueblo - PMS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400..600,0..1,0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Roboto', 'sans-serif'],
                        display: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        google: {
                            blue: '#1a73e8',
                            blueHover: '#1557b0',
                            blueLight: '#e8f0fe',
                            green: '#1e8e3e',
                            greenLight: '#e6f4ea',
                            red: '#d93025',
                            redLight: '#fce8e6',
                            yellow: '#f9ab00',
                            yellowLight: '#fef7e0',
                            bg: '#f8f9fa',
                            surface: '#ffffff',
                            border: '#dadce0',
                            text: '#202124',
                            textSec: '#5f6368'
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body class="min-h-screen font-sans antialiased">

    <!-- App Bar superior estilo Google Workspace -->
    <header class="bg-google-surface border-b border-google-border sticky top-0 z-40 px-6 py-2.5 flex flex-wrap justify-between items-center gap-4">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-google-blueLight text-google-blue flex items-center justify-center">
                <span class="material-symbols-rounded filled text-2xl">apartment</span>
            </div>
            <div>
                <h1 class="font-display text-lg font-semibold text-google-text leading-tight">Hotel Mi Pueblo</h1>
                <p class="text-xs text-google-textSec">Recepción y Control de Alojamiento</p>
            </div>
        </div>

        <!-- Navegación principal -->
        <nav class="flex flex-wrap items-center bg-google-bg p-1 rounded-full border border-google-border gap-1">
            <button data-vista="tablero" class="nav-tab flex items-center gap-1.5 px-3.5 py-1.5 rounded-full text-xs font-medium bg-google-surface text-google-blue shadow-sm transition">
                <span class="material-symbols-rounded text-base">grid_view</span>
                Mapa por Pisos
            </button>
            <button data-vista="checkin" class="nav-tab flex items-center gap-1.5 px-3.5 py-1.5 rounded-full text-xs font-medium text-google-textSec hover:text-google-text transition">
                <span class="material-symbols-rounded text-base">person_add</span>
                Registro de Entrada
            </button>
            <button data-vista="llegadas" class="nav-tab flex items-center gap-1.5 px-3.5 py-1.5 rounded-full text-xs font-medium text-google-textSec hover:text-google-text transition">
                <span class="material-symbols-rounded text-base">schedule</span>
                Registro de Llegadas
            </button>
            <button data-vista="huespedes" class="nav-tab flex items-center gap-1.5 px-3.5 py-1.5 rounded-full text-xs font-medium text-google-textSec hover:text-google-text transition">
                <span class="material-symbols-rounded text-base">groups</span>
                Huéspedes
            </button>
        </nav>

        <div class="flex items-center gap-3">
            <div id="status-api" class="flex items-center gap-2 text-xs font-medium bg-google-bg border border-google-border px-3 py-1.5 rounded-full text-google-textSec">
                <span class="w-2 h-2 rounded-full bg-google-yellow animate-pulse"></span> Conectando...
            </div>
            <button id="btn-refresh" class="w-9 h-9 rounded-full text-google-textSec hover:bg-google-bg flex items-center justify-center transition" title="Actualizar datos">
                <span class="material-symbols-rounded">refresh</span>
            </button>
        </div>
    </header>

    <!-- Contenedor donde se inyectan tablero.html, checkin.html, llegadas.html y huespedes.html -->
    <main id="app-contenedor"></main>

    <script type="module" src="/static/js/app.js"></script>
</body>
</html>
